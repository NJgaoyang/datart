spring:
  main:
    # Spring Boot 2.6+ 默认禁止 Bean 循环依赖；datart 存在历史循环引用，恢复允许以保证启动
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://${datasource.ip:127.0.0.1}:${datasource.port:3306}/${datasource.database:datart}?&allowMultiQueries=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${datasource.username:root}
    password: ${datasource.password:123456}
    druid:
      # 连接池保活配置，防止 MySQL 连接超时断开
      test-while-idle: true                           # 空闲时检测连接是否有效
      test-on-borrow: false                           # 获取连接时不检测（避免性能损耗）
      test-on-return: false                           # 归还连接时不检测
      validation-query: SELECT 1                      # 心跳检测 SQL
      time-between-eviction-runs-millis: 60000        # 每 60 秒扫描一次空闲连接
      min-evictable-idle-time-millis: 300000          # 空闲超过 5 分钟才回收
      keep-alive: true                                # 保持连接活跃
      keep-alive-between-time-millis: 120000          # 每 120 秒发送保活心跳（必须大于 time-between-eviction-runs-millis）
      # 连接超时
      max-wait: 60000                                 # 获取连接最长等待时间
      # 连接泄漏检测
      remove-abandoned: true                          # 自动回收泄漏连接
      remove-abandoned-timeout: 300                   # 超过 5 分钟未关闭视为泄漏
      log-abandoned: true                             # 记录泄漏日志

