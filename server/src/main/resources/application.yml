spring:
  application:
    name: datart-server

  main:
    banner-mode: off

  servlet:
    multipart:
      max-file-size: ${datart.upload.max-file-size:100MB}
      max-request-size: ${datart.upload.max-request-size:110MB}

  web:
    resources:
      static-locations: file:${datart.env.file-path}
      cache:
        cachecontrol:
          cache-public: true
          no-cache: true
          no-store: false

  messages:
    basename: i18n.datart_i18n

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      FAIL_ON_EMPTY_BEANS: false
      FAIL_ON_UNWRAPPED_TYPE_IDENTIFIERS: false

  quartz:
    job-store-type: jdbc
    scheduler-name: DatartScheduler
    jdbc:
      # Quartz tables are managed by the application database migration.
      # Recreating them on every restart can erase persisted schedules.
      initialize-schema: never

mybatis:
  type-aliases-package: datart.core.entity
  configuration:
    use-generated-keys: true
    map-underscore-to-camel-case: true

logging:
  level:
    datart:
      core:
        mappers: info
      data.provider.jdbc: info
  config: config/logback.xml

shiro:
  web:
    enabled: false

datart:
  migration:
    enable: true

  server:
    path-prefix: /api/v1

  tpa:
    wechat-mini-app:
      timestamp-tolerance-seconds: ${WECHAT_MINI_APP_TIMESTAMP_TOLERANCE_SECONDS:300}
      web-base-url: ${WECHAT_MINI_APP_WEB_BASE_URL:}

server:
  port: 8080
  address: 0.0.0.0

  compression:
    enabled: true
    mime-types: application/javascript,application/json,application/xml,text/html,text/xml,text/plain,text/css,image/*
