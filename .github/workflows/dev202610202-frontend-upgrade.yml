name: dev202610202 frontend framework upgrade

on:
  push:
    branches: [dev202610202]
    paths:
      - 'frontend/**'
      - frontend/package.json
      - frontend/vite.config.ts
      - frontend/vitest.config.ts
      - frontend/scripts/check-framework-upgrade-baseline.mjs
      - .github/workflows/dev202610202-frontend-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-major-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-lock-and-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependency graph for new major versions
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build(frontend): lock migrated React 19 Vite 8 ECharts 6 AntD 6 graph"
            git push origin HEAD:dev202610202
          fi
      - name: Install lock and check version invariants
        run: |
          npm ci --legacy-peer-deps
          npm run check:upgrade-baseline
      - name: Rewrite removed React and AntD legacy APIs
        run: node scripts/migrate-react19-antd6.mjs
      - name: Commit mechanical React and AntD compatibility changes
        run: |
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            HUSKY=0 git commit -m "refactor(frontend): migrate React 19 refs and AntD 6 UI props"
            HUSKY=0 git push origin HEAD:dev202610202
          fi
      - name: React 19 draggable and resizable mount regression
        run: npx vitest run src/app/components/Compat/__tests__/ResizableReact19.test.tsx
      - name: React 19 Monaco lifecycle crash regression
        run: npx vitest run src/app/components/Compat/__tests__/MonacoEditor.test.tsx
      - name: Dataset save state regression
        run: npx vitest run src/app/pages/MainPage/pages/ViewPage/slice/__tests__/saveViewState.test.ts
      - name: BI report query and render regression
        run: npx vitest run src/app/pages/DashBoardPage/pages/Board/slice/__tests__/widgetDataBatcher.test.ts src/app/components/ChartIFrameContainer/__tests__/ChartIFrameEventBroker.test.ts
      - name: BI chart resource loading regression
        run: npx vitest run src/app/components/ChartIFrameContainer/__tests__/ChartIFrameResourceLoader.test.ts
      - name: SQL workbench split regression
        run: npx vitest run src/app/components/__tests__/SplitWorkbench.test.tsx
      - name: TypeScript and grid-specific regression
        run: npm run check:grid
      - name: React and chart compatibility smoke
        if: always()
        run: |
          npm run test:bundle-budget
          npm run build:all
      - name: Report bundle sizes
        if: success()
        run: npm run report:bundles
