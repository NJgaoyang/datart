name: Dashboard grid v2 checks

on:
  push:
    branches: [dev20261017]
    paths:
      - 'frontend/**'
      - 'core/**'
      - 'server/**'
      - 'data-providers/**'
      - 'tools/grid-layout-migration*'
      - '.github/workflows/dashboard-grid-v2.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'core/**'
      - 'server/**'
      - 'data-providers/**'
      - 'tools/grid-layout-migration*'
      - '.github/workflows/dashboard-grid-v2.yml'
  workflow_dispatch:

concurrency:
  group: dashboard-grid-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: TypeScript and targeted native RGL v2 tests
        run: npm run check:grid
      - name: Native v2 compaction performance baseline (100/500/1000 widgets)
        run: npm run bench:grid
      - name: Production frontend build
        run: npm run build
      - name: Capture per-entry JavaScript bundle baseline
        run: npm run report:bundles
      - name: Install locked Playwright and Chromium (entry-point smoke only)
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
      - name: Check built login and share entries in real Chromium
        env:
          DATART_TEST_BASE_URL: http://127.0.0.1:4173
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 > /tmp/datart-preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/login > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/shareDashboard.html > /dev/null
          cd e2e
          npm test -- --project=chromium-smoke --workers=1
      - name: Upload Chromium entry smoke diagnostics (no auth state)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-chromium-entry-smoke
          if-no-files-found: ignore
          path: |
            frontend/e2e/test-results/
            frontend/e2e/playwright-report/

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile Java server with dependency modules
        run: mvn --batch-mode -pl server -am -DskipTests package
      - name: Security, SQL metrics, join and Excel export regression tests
        run: mvn --batch-mode -pl server -am -Dtest=ColumnPermissionFilterTest,SqlBuilderAggregateTest,PoiConvertUtilsDisplayNameTest,ViewJoinColumnNameTest,DownloadServiceSecurityTest,ShareSupportedFunctionSecurityTest,ViewFieldCommentLifecycleTest,ViewFieldServiceImplTest,SqlQueryScriptProcessorVariableScopeTest -Dsurefire.failIfNoSpecifiedTests=false test

  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test the standalone offline layout migration and rollback
        run: node --test tools/grid-layout-migration.test.mjs
