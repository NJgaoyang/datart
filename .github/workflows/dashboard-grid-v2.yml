name: Dashboard grid v2 checks

on:
  push:
    branches: [dev20261017]
    paths:
      - 'frontend/**'
      - 'core/**'
      - 'server/**'
      - 'data-providers/**'
      - 'tools/grid-layout-migration*'
      - '.github/workflows/dashboard-grid-v2.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'core/**'
      - 'server/**'
      - 'data-providers/**'
      - 'tools/grid-layout-migration*'
      - '.github/workflows/dashboard-grid-v2.yml'
  workflow_dispatch:

concurrency:
  group: dashboard-grid-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: TypeScript and targeted native RGL v2 tests
        run: npm run check:grid
      - name: Native v2 compaction performance baseline (100/500/1000 widgets)
        run: npm run bench:grid
      - name: Production frontend build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile Java server with dependency modules
        run: mvn --batch-mode -pl server -am -DskipTests package
      - name: Security, SQL metrics, join and Excel export regression tests
        run: mvn --batch-mode -pl server -am -Dtest=ColumnPermissionFilterTest,SqlBuilderAggregateTest,PoiConvertUtilsDisplayNameTest,ViewJoinColumnNameTest,DownloadServiceSecurityTest,ViewFieldCommentLifecycleTest,SqlQueryScriptProcessorVariableScopeTest -Dsurefire.failIfNoSpecifiedTests=false test

  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test the standalone offline layout migration and rollback
        run: node --test tools/grid-layout-migration.test.mjs
